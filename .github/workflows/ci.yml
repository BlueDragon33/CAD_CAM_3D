name: CAD CAM 3D CI

on:
  push:
    branches: [main, foundation/general-system]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit regression
        run: npm run test
      - name: Exact B-Rep smoke
        run: npm run smoke:exact
      - name: Build
        run: npm run build
      - name: Verify browser test runtime
        run: |
          google-chrome --version
          chromedriver --version
      - name: Browser critical journey
        run: timeout 210s npm run smoke:browser
      - name: Save sanitized browser performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-browser-performance
          path: reports/browser-performance.json
          if-no-files-found: warn
          retention-days: 14
