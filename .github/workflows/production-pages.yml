name: CAD CAM 3D Production Pages

on:
  workflow_run:
    workflows: ["CAD CAM 3D CI"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cad-cam-3d-production-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Checkout exact CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify exact release revision
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          echo "Release revision verified: $RELEASE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build exact production revision
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Write release evidence
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('dist/release.json', JSON.stringify({version:'1.0.0',sha:process.env.RELEASE_SHA,sourceCiRunId:Number(process.env.SOURCE_CI_RUN_ID),channel:'production'}, null, 2)+'\\n')"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: production-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact main revision to Production Pages
        id: deployment
        uses: actions/deploy-pages@v4
