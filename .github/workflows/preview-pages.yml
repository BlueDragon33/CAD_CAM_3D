name: CAD CAM 3D Preview Build

on:
  push:
    branches:
      - foundation/general-system
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cad-cam-3d-preview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build preview artifact
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cad-cam-3d-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
