name: CAD CAM 3D Preview Build

on:
  push:
    branches:
      - foundation/general-system
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cad-cam-3d-preview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Check lockfile presence
        id: lock
        run: |
          if [ -f package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies and resolve bootstrap lock
        run: npm install --no-audit --no-fund

      - name: Commit bootstrap lockfile once
        if: steps.lock.outputs.present == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): lock v1 dependency graph"
          git push origin HEAD:foundation/general-system

      - name: Build preview artifact
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cad-cam-3d-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
